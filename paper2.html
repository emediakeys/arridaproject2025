        // THE AI ANSWER KEY (PAPER II)
        const aiAnswerKey = [
            "B", "D", "B", "D", "B", "A", "A", "B", "A", "C",
            "A", "C", "B", "A", "D", "B", "D", "D", "A", "B",
            "A", "D", "B", "C", "B", "A", "C", "A", "C", "A",
            "A", "D", "B", "B", "B", "C", "C", "B", "D", "A",
            "A", "D", "B", "A", "A", "D", "C", "B", "C", "C",
            "A", "D", "C", "C", "D", "A", "B", "B", "A", "D",
            "D", "B", "D", "D", "D", "B", "D", "B", "A", "B",
            "D", "A", "D", "A", "D", "C", "B", "C", "D", "D",
            "A", "C", "A", "B", "C", "A", "B", "D", "A", "A",
            "A", "B", "B", "B", "B", "D", "A", "C", "D", "D"
        ];

        /* --- UI HELPERS --- */
        window.toggleAuthView = (v) => {
            document.getElementById('loginView').classList.toggle('hidden-view', v !== 'login');
            document.getElementById('registerView').classList.toggle('hidden-view', v !== 'register');
        };

        window.showToast = (msg, err = false) => {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `fixed top-5 right-5 px-6 py-3 rounded-lg text-white font-bold transition-opacity z-50 ${err ? 'bg-red-600' : 'bg-green-600'}`;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 3000);
        };

        // NEW: Dynamic Modular Popup System
        window.showModal = (type, title, message, confirmText, onConfirm) => {
            const modal = document.getElementById('customModal');
            const iconContainer = document.getElementById('modalIconContainer');
            const titleEl = document.getElementById('modalTitle');
            const messageEl = document.getElementById('modalMessage');
            const buttonsEl = document.getElementById('modalButtons');

            titleEl.textContent = title;
            messageEl.textContent = message;
            modal.classList.remove('hidden-view');

            if (type === 'confirm') {
                iconContainer.className = 'w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-5 bg-yellow-100 text-yellow-600';
                iconContainer.innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                
                buttonsEl.innerHTML = `
                    <button onclick="window.closeModal()" class="flex-1 py-3 px-4 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition">Cancel</button>
                    <button id="modalConfirmBtn" class="flex-1 py-3 px-4 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-md transition">${confirmText}</button>
                `;
            } else if (type === 'alert') {
                iconContainer.className = 'w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-5 bg-red-100 text-red-600';
                iconContainer.innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                
                buttonsEl.innerHTML = `
                    <button id="modalConfirmBtn" class="w-full py-3 px-4 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 shadow-md transition">${confirmText}</button>
                `;
            }

            document.getElementById('modalConfirmBtn').onclick = () => {
                window.closeModal();
                if(onConfirm) onConfirm();
            };
        };

        window.closeModal = () => {
            document.getElementById('customModal').classList.add('hidden-view');
        };

        /* --- VALIDATION --- */
        window.checkDuplicates = async () => {
            if (!dbClient) return;
            const email = document.getElementById('regEmail').value.trim();
            const matric = document.getElementById('regMatric').value.trim();

            if (email) {
                const { data } = await dbClient.from('students').select('email').eq('email', email).maybeSingle();
                isEmailUnique = !data;
                document.getElementById('emailWarnText').textContent = isEmailUnique ? "" : "This Email is already registered.";
            } else {
                isEmailUnique = true;
                document.getElementById('emailWarnText').textContent = "";
            }

            if (matric) {
                const { data } = await dbClient.from('students').select('admission_no').eq('admission_no', matric).maybeSingle();
                isMatricUnique = !data;
                document.getElementById('matricWarnText').textContent = isMatricUnique ? "" : "This Matric No is already registered.";
            } else {
                isMatricUnique = true;
                document.getElementById('matricWarnText').textContent = "";
            }
            window.liveValidate();
        };

        window.debouncedCheck = () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => window.checkDuplicates(), 500); 
        };

        window.liveValidate = () => {
            const p = document.getElementById('regPassword').value;
            const c = document.getElementById('regConfirmPassword').value;
            const btn = document.getElementById('regSubmitBtn');
            const valid = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{6,}$/.test(p);
            const match = p === c && p !== '';
            document.getElementById('pwdReqText').textContent = valid ? "" : "Min 6 chars, letters & numbers.";
            document.getElementById('pwdMatchText').textContent = match ? "Match" : "No match";
            
            btn.disabled = !(valid && match && isEmailUnique && isMatricUnique);
            btn.style.opacity = btn.disabled ? '0.5' : '1';
        };

        /* --- EXAM LOGIC --- */
        function parseExam() {
            const qBlocks = rawExamText.trim().split(/\n(?=\d+\.)/);
            return qBlocks.map((b, i) => {
                const lines = b.split('\n').map(l => l.trim()).filter(l => l);
                const opts = {};
                lines.slice(1).forEach(l => {
                    const m = l.match(/^([A-D])\.\s*(.*)/i);
                    if (m) opts[m[1].toUpperCase()] = m[2];
                });
                return { question: lines[0].replace(/^\d+\.\s*/, ''), options: opts, ans: aiAnswerKey[i] || "A" };
            });
        }

        window.renderCurrentQuestion = () => {
            const q = parsedExamQuestions[currentQuestionIndex];
            document.getElementById('currentQIndex').textContent = currentQuestionIndex + 1;
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('progressBar').style.width = `${((currentQuestionIndex + 1) / parsedExamQuestions.length) * 100}%`;
            
            let html = "";
            for (let key in q.options) {
                const sel = studentAnswers[currentQuestionIndex] === key;
                html += `<label class="block p-4 border rounded-xl cursor-pointer transition-all ${sel ? 'bg-blue-50 border-blue-500 shadow-sm' : 'hover:bg-gray-50'}">
                    <input type="radio" name="opt" value="${key}" ${sel ? 'checked' : ''} onchange="window.recordAnswer('${key}')" class="mr-3 w-5 h-5 text-blue-600 cursor-pointer">
                    <span class="font-bold mr-1 text-gray-800">${key}.</span> <span class="text-gray-700">${q.options[key]}</span>
                </label>`;
            }
            document.getElementById('optionsArea').innerHTML = html;
            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            const last = currentQuestionIndex === parsedExamQuestions.length - 1;
            document.getElementById('nextBtn').classList.toggle('hidden-view', last);
            document.getElementById('submitExamBtn').classList.toggle('hidden-view', !last);
            
            // Sync the side navigator grid
            window.renderQuestionGrid();
        };

        // NEW: Render the right-side question navigator grid
        window.renderQuestionGrid = () => {
            const grid = document.getElementById('questionGrid');
            let html = '';
            for (let i = 0; i < parsedExamQuestions.length; i++) {
                const isAnswered = studentAnswers.hasOwnProperty(i);
                const isCurrent = i === currentQuestionIndex;
                
                let baseClasses = "w-10 h-10 flex items-center justify-center rounded-lg font-bold text-sm cursor-pointer transition-all duration-200 ";
                
                if (isCurrent) {
                    baseClasses += "ring-2 ring-offset-2 ring-blue-600 bg-blue-600 text-white shadow-md";
                } else if (isAnswered) {
                    baseClasses += "bg-green-500 text-white hover:bg-green-600 shadow-sm";
                } else {
                    baseClasses += "bg-white text-gray-600 hover:bg-gray-100 border border-gray-300";
                }
                
                html += `<div onclick="window.navigateQuestion(${i - currentQuestionIndex})" class="${baseClasses}">${i + 1}</div>`;
            }
            grid.innerHTML = html;
        };

        window.recordAnswer = (k) => {
            studentAnswers[currentQuestionIndex] = k;
            localStorage.setItem(`cbt_answers_paper2_${currentUserId}`, JSON.stringify(studentAnswers));
            window.renderCurrentQuestion();
        };

        window.navigateQuestion = (d) => {
            currentQuestionIndex += d;
            window.renderCurrentQuestion();
        };

        // UPDATED: Modal Integration & Safe Logout
        window.requestLogout = () => {
            window.showModal('confirm', 'Pause & Logout?', 'Your progress will be saved on this device. You can log back in later to finish your exam.', 'Yes, Logout', async () => {
                clearInterval(timerInterval);
                if(dbClient) await dbClient.auth.signOut();
                window.location.reload();
            });
        };

        window.requestFinalSubmit = () => {
            const answeredCount = Object.keys(studentAnswers).length;
            const message = answeredCount < parsedExamQuestions.length 
                ? `You have only answered ${answeredCount} out of ${parsedExamQuestions.length} questions. Are you ABSOLUTELY sure you want to submit?` 
                : `Are you sure you want to submit your Paper II exam? You cannot undo this action.`;
            
            window.showModal('confirm', 'Submit Final Exam?', message, 'Yes, Submit', () => {
                window.executeDatabaseSubmission();
            });
        };

        window.executeDatabaseSubmission = async () => {
            clearInterval(timerInterval);
            let score = 0;
            parsedExamQuestions.forEach((q, i) => { if(studentAnswers[i] === q.ans) score++; });
            
            document.getElementById('examContentArea').innerHTML = `
                <div class="text-center py-20 flex flex-col items-center">
                    <svg class="animate-spin h-10 w-10 text-blue-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <p class="text-lg text-gray-500 font-bold">Securely transmitting results...</p>
                </div>
            `;

            const { error } = await dbClient.from('results').insert({ 
                user_id: currentUserId, 
                admission_no: currentStudentData.admission_no, 
                score: score, 
                total_questions: parsedExamQuestions.length,
                paper_type: 'Paper II' 
            });
            
            if(error) return window.showToast("Error saving results. Please contact an administrator.", true);
            
            localStorage.removeItem(`cbt_exam_end_paper2_${currentUserId}`);
            localStorage.removeItem(`cbt_answers_paper2_${currentUserId}`);
            
            document.getElementById('examContentArea').innerHTML = `
                <div class="text-center py-16">
                    <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <h2 class='text-center text-3xl font-bold text-gray-900 mb-4'>Paper II Submitted Successfully</h2>
                    <p class="mb-8 text-gray-500 font-medium">Your responses have been securely recorded.</p>
                    <button onclick="window.logoutSession()" class="px-8 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-md">Secure Logout</button>
                </div>
            `;
        };

        window.logoutSession = async () => {
            clearInterval(timerInterval);
            if(dbClient) await dbClient.auth.signOut();
            window.location.reload();
        };

        // UPDATED: Fixed timer integrity so logging out does not reset or pause the 2 hours
        window.startCountdownTimer = (endTime) => {
            timerInterval = setInterval(() => {
                const now = new Date().getTime();
                const dist = endTime - now;
                if (dist <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timerDisplay').textContent = "00:00:00";
                    window.showModal('alert', 'Time is Up!', 'Your exam duration has elapsed. Your answers will now be submitted automatically.', 'Understood', () => {
                        window.executeDatabaseSubmission();
                    });
                    return;
                }
                const h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((dist % (1000 * 60)) / 1000);
                document.getElementById('timerDisplay').textContent = `${h < 10 ? '0'+h : h}:${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
            }, 1000);
        };

        /* --- INITIALIZATION --- */
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('regPassword').oninput = window.liveValidate;
            document.getElementById('regConfirmPassword').oninput = window.liveValidate;
            document.getElementById('regEmail').addEventListener('input', window.debouncedCheck);
            document.getElementById('regMatric').addEventListener('input', window.debouncedCheck);
            
            if(window.supabase) {
                dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }

            document.getElementById('registerForm').onsubmit = async (e) => {
                e.preventDefault();
                if(!dbClient) return window.showToast("Database error", true);
                
                const btn = document.getElementById('regSubmitBtn');
                btn.textContent = "Processing..."; btn.disabled = true;

                try {
                    const email = document.getElementById('regEmail').value.trim();
                    const pwd = document.getElementById('regPassword').value;
                    const { data, error: aErr } = await dbClient.auth.signUp({ email, password: pwd });
                    if(aErr) throw aErr;
                    
                    const { error: dbErr } = await dbClient.from('students').insert({ 
                        user_id: data.user.id, 
                        first_name: document.getElementById('regFirstName').value.trim(), 
                        last_name: document.getElementById('regLastName').value.trim(), 
                        admission_no: document.getElementById('regMatric').value.trim(),
                        email: email 
                    });
                    if(dbErr) throw dbErr;
                    
                    window.showToast("Registered! Please login.");
                    document.getElementById('registerForm').reset();
                    window.liveValidate();
                    window.toggleAuthView('login');
                } catch (error) {
                    window.showToast(error.message, true);
                    btn.textContent = "Complete Registration"; btn.disabled = false;
                }
            };

            document.getElementById('loginForm').onsubmit = async (e) => {
                e.preventDefault();
                
                const btn = document.getElementById('loginSubmitBtn');
                btn.textContent = "Authenticating..."; btn.disabled = true;

                if(!dbClient) {
                    btn.textContent = "Start Paper II"; btn.disabled = false;
                    return window.showToast("Database error", true);
                }
                
                try {
                    const { data, error } = await dbClient.auth.signInWithPassword({
                        email: document.getElementById('loginEmail').value.trim(),
                        password: document.getElementById('loginPassword').value
                    });
                    if(error) throw new Error("Invalid credentials");
                    
                    currentUserId = data.user.id;

                    const { data: existingResult } = await dbClient.from('results').select('id').eq('user_id', currentUserId).eq('paper_type', 'Paper II').maybeSingle();
                    if (existingResult) {
                        await dbClient.auth.signOut(); 
                        throw new Error("Access Denied: You have already submitted Paper II.");
                    }

                    const { data: sData, error: sErr } = await dbClient.from('students').select('*').eq('user_id', currentUserId).single();
                    if(sErr) throw new Error("Error fetching profile");
                    
                    currentStudentData = sData;
                    parsedExamQuestions = parseExam();
                    
                    document.getElementById('authContainer').classList.add('hidden-view');
                    document.getElementById('bodyElement').classList.replace('items-center', 'items-start');
                    document.getElementById('bodyElement').classList.remove('p-4');
                    document.getElementById('examContainer').classList.remove('hidden-view');
                    document.getElementById('studentInfoDisplay').textContent = `${sData.first_name} ${sData.last_name} | ${sData.admission_no}`;
                    
                    let endTime = localStorage.getItem(`cbt_exam_end_paper2_${currentUserId}`);
                    if (!endTime) {
                        endTime = new Date().getTime() + (2 * 60 * 60 * 1000);
                        localStorage.setItem(`cbt_exam_end_paper2_${currentUserId}`, endTime);
                    }
                    const savedAns = localStorage.getItem(`cbt_answers_paper2_${currentUserId}`);
                    if(savedAns) studentAnswers = JSON.parse(savedAns);

                    window.startCountdownTimer(endTime);
                    window.renderCurrentQuestion();

                } catch (error) {
                    window.showToast(error.message, true);
                    btn.textContent = "Start Paper II"; btn.disabled = false;
                }
            };
        });
    </script>
